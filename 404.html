<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1340">
<title>صفحه پیدا نشد | کوروش</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=JetBrains+Mono:wght@500&family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%230B1340%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2243%22%20font-family%3D%22monospace%22%20font-size%3D%2234%22%20font-weight%3D%22700%22%20fill%3D%22%23FFD76A%22%20text-anchor%3D%22middle%22%3EK.%3C/text%3E%3C/svg%3E" type="image/svg+xml">
<style>
/* Box-model theme: the visual language of browser DevTools (margin / border / padding / content).
   Persian (RTL) first, English (LTR) via lang switch. */
:root{
  color-scheme:dark;
  --bg:#0B1340;--sf:#111B55;--tx:#F4F2FF;--mu:#AEB6E3;--ln:rgba(244,242,255,.16);--on:#0B1340;
  --m:#FFB26B;--b:#FFD76A;--p:#8ED69B;--c:#7DB4FF;
  --hue:#FFD76A;--m-rgb:255,178,107;--b-rgb:255,215,106;--p-rgb:142,214,155;--c-rgb:125,180,255;
  --ease:cubic-bezier(.22,1,.36,1);
  --f:'Bricolage Grotesque',Vazirmatn,system-ui,sans-serif;
  --fd:'Bricolage Grotesque',Vazirmatn,system-ui,sans-serif
}
:lang(fa){--f:Vazirmatn,'Bricolage Grotesque',Tahoma,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:90px;accent-color:var(--b)}
body{position:relative;font-family:var(--f);font-size:16px;background:var(--bg);color:var(--tx);line-height:1.95;padding-top:env(safe-area-inset-top);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(50% 45% at 88% 0%,rgba(var(--m-rgb),.15),transparent 70%),
  radial-gradient(45% 50% at 4% 8%,rgba(var(--c-rgb),.2),transparent 70%),
  linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/56px 56px,
  linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/56px 56px}
a{color:inherit;text-decoration:none}ul{list-style:none;padding:0}
::selection{background:var(--b);color:var(--on)}
:focus-visible{outline:2px solid var(--b);outline-offset:3px;border-radius:4px}
.mono{font-size:15px;color:var(--mu)}
.skip{position:absolute;inset-inline-start:12px;top:-60px;background:var(--b);color:var(--on);padding:8px 16px;border-radius:8px;z-index:99;font-weight:700}.skip:focus{top:12px}
.w{max-width:1160px;margin-inline:auto;padding-inline:max(6vw,22px)}

/* Header */
header{position:sticky;top:0;z-index:50;background:rgba(11,19,64,.72);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--ln);transition:box-shadow .4s var(--ease)}
header.sc{box-shadow:0 14px 30px -20px rgba(0,0,0,.7)}
header .w{display:flex;align-items:center;justify-content:space-between;height:70px;gap:16px}
.logo{direction:ltr;display:inline-flex;align-items:center;font-family:var(--fd);font-weight:800;font-size:21px;line-height:1;padding:8px 13px;border:2px solid var(--b);border-radius:7px;color:var(--tx);box-shadow:0 0 0 0 rgba(var(--m-rgb),.3);transition:box-shadow .45s var(--ease),transform .45s var(--ease)}
.logo b{font-weight:800;color:var(--m)}
.logo:hover{box-shadow:0 0 0 7px rgba(var(--m-rgb),.28);transform:translateY(-1px)}
nav ul{display:flex;gap:4px;color:var(--mu);font-size:15px}
nav a{display:inline-block;padding:5px 16px;border-radius:8px;transition:color .25s,background-color .25s,transform .35s var(--ease)}
nav a:hover{color:var(--tx);background:rgba(255,255,255,.09)}
nav a.on,nav a.cur{background:var(--b);color:var(--on);font-weight:700}
.lang{display:flex;border:1.5px solid var(--ln);border-radius:9px;overflow:hidden}
.lang button{all:unset;cursor:pointer;padding:4px 14px;font-size:13px;color:var(--mu);font-family:'Bricolage Grotesque',Vazirmatn,sans-serif;transition:background-color .3s var(--ease),color .3s}
.lang button:hover{color:var(--tx)}
.lang button[aria-pressed=true]{background:var(--c);color:var(--on);font-weight:700}
.lang button:focus-visible{outline:2px solid var(--b);outline-offset:-2px}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:64px;align-items:center;padding-block:56px 88px}
.hero .mono{display:inline-flex;align-items:center;gap:10px}
.hero .mono:before{content:"";width:12px;height:12px;border-radius:3px;background:var(--p);box-shadow:0 0 0 4px rgba(var(--p-rgb),.24)}
h1{font-size:clamp(32px,5vw,62px);line-height:1.3;font-weight:800;letter-spacing:-.02em;text-wrap:balance}:lang(fa) h1{letter-spacing:0;line-height:1.55}
h1 em{font-style:normal}
.lead{color:var(--mu);font-size:18px;max-width:600px}
.btns{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:10px;font-weight:700;font-size:15px;border:1.5px solid var(--ln);background:transparent;color:var(--tx);overflow-wrap:anywhere;transition:transform .4s var(--ease),box-shadow .4s var(--ease),background-color .25s,border-color .25s,color .25s}
.btn:hover{transform:translateY(-3px);border-color:var(--tx);background:rgba(255,255,255,.07)}
.btn:active{transform:translateY(0) scale(.98);transition-duration:.1s}
.btn.p{background:var(--b);border-color:var(--b);color:var(--on)}
.btn.p:hover{background:#FFE393;border-color:#FFE393;box-shadow:0 0 0 6px rgba(var(--b-rgb),.22),0 18px 30px -14px rgba(var(--b-rgb),.65)}
.btn .gh{font-family:'Bricolage Grotesque',sans-serif;opacity:.85;direction:ltr;display:inline-block;font-weight:500}
.nb{white-space:nowrap}

/* Inspector overlay on the headline */
.insp{position:relative;margin:56px 0 30px;padding:16px 20px;border:6px solid transparent;border-radius:6px;background-clip:padding-box;box-shadow:0 0 0 22px transparent;outline:1px dashed transparent;outline-offset:22px;
  transition:box-shadow .5s var(--ease),border-color .5s var(--ease),background-color .5s var(--ease),outline-color .5s var(--ease);
  animation:im 2.6s .5s,ib 2.6s .9s,ip 2.6s 1.3s}
.insp h1{margin:0;background:transparent;transition:background-color .5s var(--ease);animation:ic 2.6s 1.7s}
.insp:after{content:"h1  " attr(data-dim);position:absolute;bottom:calc(100% + 30px);inset-inline-start:-6px;direction:ltr;white-space:pre;font:500 12.5px/1 'JetBrains Mono',ui-monospace,monospace;background:var(--c);color:var(--on);padding:6px 10px;border-radius:5px;opacity:0;transform:translateY(4px);transition:opacity .4s,transform .4s var(--ease);animation:il 3.4s .5s}
.insp:hover,.insp:focus-within{border-color:rgba(var(--b-rgb),.6);background-color:rgba(var(--p-rgb),.16);box-shadow:0 0 0 22px rgba(var(--m-rgb),.16);outline-color:rgba(var(--m-rgb),.75)}
.insp:hover h1,.insp:focus-within h1{background:rgba(var(--c-rgb),.24)}
.insp:hover:after,.insp:focus-within:after{opacity:1;transform:none}
@keyframes im{35%,70%{box-shadow:0 0 0 22px rgba(var(--m-rgb),.16);outline-color:rgba(var(--m-rgb),.75)}}
@keyframes ib{35%,70%{border-color:rgba(var(--b-rgb),.6)}}
@keyframes ip{35%,70%{background-color:rgba(var(--p-rgb),.16)}}
@keyframes ic{35%,70%{background-color:rgba(var(--c-rgb),.24)}}
@keyframes il{15%,80%{opacity:1;transform:none}}

/* "Now" panel drawn as a box model: goal outside, current focus at the core */
.bm .ph{font-size:14px;color:var(--mu);margin-bottom:12px;line-height:1.6}
.bm-l{--a:.16;position:relative;padding:40px 16px 16px;border-radius:8px;animation:bmin .9s var(--ease) backwards;transition:background-color .35s var(--ease),border-color .35s}
.bm-l:hover:not(:has(.bm-l:hover)){--a:.3}
.bm-l.m{--rgb:var(--m-rgb);background:rgba(var(--m-rgb),var(--a));border:1.5px dashed rgba(var(--m-rgb),.75);animation-delay:.2s}
.bm-l.b{--rgb:var(--b-rgb);--a:.2;background:rgba(var(--b-rgb),var(--a));border:2px solid rgba(var(--b-rgb),.85);animation-delay:.45s}
.bm-l.p{--rgb:var(--p-rgb);background:rgba(var(--p-rgb),var(--a));border:1.5px dashed rgba(var(--p-rgb),.75);animation-delay:.7s}
.bm-l.c{--rgb:var(--c-rgb);--a:.24;background:rgba(var(--c-rgb),var(--a));border:2px solid rgba(var(--c-rgb),.85);animation-delay:.95s;min-height:76px}
.bm-l.b:hover:not(:has(.bm-l:hover)),.bm-l.c:hover:not(:has(.bm-l:hover)){--a:.34}
.bm-t{position:absolute;top:9px;inset-inline:16px;display:flex;justify-content:space-between;gap:12px;font-size:13px;line-height:1.8;color:var(--mu)}
.bm-t b{color:var(--tx);font-weight:700;direction:ltr}
@keyframes bmin{from{opacity:0;transform:scale(.93)}}

/* Sections */
section{--hue:var(--m);position:relative;padding-block:92px 8px}
main>section:nth-of-type(4n+2){--hue:var(--b)}main>section:nth-of-type(4n+3){--hue:var(--p)}main>section:nth-of-type(4n+4){--hue:var(--c)}
#contact{--hue:var(--c)}
h2{font-size:clamp(30px,4.4vw,54px);line-height:1.5;font-weight:800;letter-spacing:-.015em;margin:0 0 30px;text-wrap:balance}:lang(fa) h2{letter-spacing:0}
h2:after{content:"";display:block;width:84px;height:7px;border-radius:4px;background:var(--hue);margin-top:14px;transition:width .6s var(--ease)}
section:hover h2:after{width:132px}
.txt{color:var(--mu);max-width:740px;font-size:17px}.txt p+p{margin-top:14px}.txt strong{color:var(--tx)}.txt p+ul,.txt ul+p{margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.two h3{font-size:26px;line-height:1.6;font-weight:800;margin-bottom:6px}
.big{margin-top:14px;padding:20px 24px;border-inline-start:5px solid var(--hue);border-start-end-radius:14px;border-end-end-radius:14px;background:rgba(255,255,255,.05)}

/* Projects — wide rows with a box-model reveal on hover */
.cards{display:grid;gap:26px}.txt+.cards,.txt+.two,.txt+.skills{margin-top:36px}
.card{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);background:rgba(17,27,85,.78);border:1.5px solid var(--ln);border-radius:18px;overflow:hidden;transition:transform .55s var(--ease),border-color .35s,box-shadow .55s var(--ease)}
.card:hover{transform:translateY(-5px);border-color:rgba(var(--b-rgb),.7);box-shadow:0 30px 50px -30px rgba(0,0,0,.8)}
.vis{position:relative;display:flex;justify-content:center;align-items:center;min-height:250px;padding:44px 28px 28px;direction:ltr;font-family:var(--fd);font-weight:800;font-size:clamp(24px,3vw,36px);letter-spacing:-.02em;color:var(--tx);background:linear-gradient(135deg,rgba(var(--c-rgb),.26),rgba(var(--m-rgb),.16));box-shadow:inset 0 0 0 0 rgba(var(--m-rgb),0),inset 0 0 0 0 rgba(var(--b-rgb),0),inset 0 0 0 0 rgba(var(--p-rgb),0);transition:box-shadow .7s var(--ease)}
.vis:before{content:"";position:absolute;top:16px;left:18px;width:10px;height:10px;border-radius:50%;background:var(--m);box-shadow:16px 0 var(--b),32px 0 var(--p)}
.vis span{color:var(--b);font-weight:500}
.card:hover .vis{box-shadow:inset 0 0 0 14px rgba(var(--m-rgb),.62),inset 0 0 0 28px rgba(var(--b-rgb),.5),inset 0 0 0 42px rgba(var(--p-rgb),.42)}
.cb{padding:34px;display:flex;flex-direction:column;gap:14px}.cb h3{font-size:28px;line-height:1.5;font-weight:800;transition:color .3s}.cb p{color:var(--mu);font-size:16px}
.card:hover .cb h3{color:var(--b)}
.tags{display:flex;flex-wrap:wrap;gap:8px}.tags i{font-style:normal;font-size:13px;padding:1px 12px;border:1.5px solid var(--ln);border-radius:6px;color:var(--mu)}
.cb .go,.acts .go{margin-top:auto;color:var(--b);font-weight:700;padding-bottom:2px;background:linear-gradient(currentColor,currentColor) no-repeat right 100%/0 2px;transition:background-size .45s var(--ease)}
[dir=ltr] .cb .go,[dir=ltr] .acts .go{background-position:left 100%}
.cb .go:hover,.acts .go:hover{background-size:100% 2px}

/* Skills — colour encodes status (same colours as the box layers) */
.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:6px}
.grp{background:rgba(17,27,85,.78);border:1.5px solid var(--ln);border-radius:14px;padding:24px;transition:transform .5s var(--ease),border-color .35s,background-color .35s}
.grp:hover{transform:translateY(-4px);border-color:rgba(var(--p-rgb),.7)}
.grp h3{font-size:16px;line-height:1.6;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chips li{padding:3px 15px;border-radius:8px;font-size:14px;font-weight:500;line-height:1.8;border:1.5px solid var(--ln);transition:transform .4s var(--ease),background-color .3s,box-shadow .4s var(--ease)}
.chips li:hover{transform:translateY(-3px) rotate(-1.5deg)}
.chips .a{border-color:rgba(var(--p-rgb),.85);background:rgba(var(--p-rgb),.16)}.chips .a:hover{box-shadow:0 0 0 4px rgba(var(--p-rgb),.2)}
.chips .l{border-color:rgba(var(--m-rgb),.9);border-style:dashed;background:rgba(var(--m-rgb),.13)}.chips .l:hover{box-shadow:0 0 0 4px rgba(var(--m-rgb),.2)}
.chips .n{border-color:rgba(var(--c-rgb),.9);border-style:dotted;color:var(--mu)}.chips .n:hover{box-shadow:0 0 0 4px rgba(var(--c-rgb),.2)}
.leg{display:flex;flex-wrap:wrap;gap:22px;margin-top:22px;font-size:14px;font-weight:600}
.leg span:nth-child(1){color:var(--p)}.leg span:nth-child(2){color:var(--m)}.leg span:nth-child(3){color:var(--c)}
.lst{display:grid;gap:10px;margin:14px 0}.lst li{display:flex;gap:12px;align-items:baseline;color:var(--tx)}.lst li:before{content:"";flex:none;width:8px;height:8px;border-radius:2px;background:var(--hue);transform:translateY(-1px)}
.contact{padding-block:100px 110px}
.contact h2{font-size:clamp(34px,6vw,76px)}
.contact .btns .btn{padding:15px 32px;font-size:16px}

footer{border-top:1px solid var(--ln);padding:28px max(6vw,22px) calc(28px + env(safe-area-inset-bottom));text-align:center;color:var(--mu);font-size:14px}

@media(max-width:900px){
  .hero{grid-template-columns:minmax(0,1fr);gap:48px;padding-block:28px 56px}
  .bm{max-width:460px}
  .card{grid-template-columns:minmax(0,1fr)}
  .vis{min-height:190px}
}
@media(max-width:820px){
  nav{display:none}
  .two,.skills{grid-template-columns:1fr;gap:32px}
  .skills{gap:16px}
  section{padding-block:64px 4px}
  .insp{margin-top:50px;padding:12px 14px}
  .cb{padding:24px}.cb h3{font-size:24px}
  .contact{padding-block:64px 72px}
}

/* Reveal + mobile navigation (loaded after base.css) */
.rv{opacity:0}
.rv.in{opacity:1;animation:rvin .7s var(--ease) var(--d,0s) backwards}
@keyframes rvin{from{opacity:0}}
@media(scripting:none){.rv{opacity:1}}
.burger{all:unset;display:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.burger:focus-visible{outline:2px solid var(--b);outline-offset:3px;border-radius:9px}
@media(max-width:820px){
  .burger{display:grid;place-content:center;gap:4px;width:40px;height:40px;border:1.5px solid var(--ln);border-radius:9px;transition:border-color .3s,background-color .3s}
  .burger:hover{border-color:var(--tx)}
  .burger i{display:block;width:18px;height:2px;border-radius:2px;background:var(--tx);transition:transform .45s var(--ease),opacity .25s}
  header.open .burger{border-color:var(--b);background:rgba(var(--b-rgb),.12)}
  header.open .burger i:nth-child(1){transform:translateY(6px) rotate(45deg)}
  header.open .burger i:nth-child(2){opacity:0}
  header.open .burger i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
  header nav{display:block;position:absolute;top:100%;inset-inline:0;background:var(--bg);border-bottom:1px solid var(--ln);padding:8px max(6vw,22px) 16px;opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .3s var(--ease),transform .45s var(--ease),visibility 0s .45s}
  header.open nav{opacity:1;visibility:visible;transform:none;transition-delay:0s}
  header nav ul{flex-direction:column;gap:2px}
  header nav a{display:block;padding:12px 14px;font-size:17px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1}.card:hover,.grp:hover,.btn:hover,.chips li:hover{transform:none}}

/* 404 — an empty box: the page has margin, border and padding, but no content */
.nf{min-height:calc(100vh - 71px);display:grid;place-items:center;padding-block:56px;text-align:center}
.nf-in{display:grid;justify-items:center;width:min(640px,100%)}
.nf-l{position:relative;border-radius:12px;animation:bmin .9s var(--ease) backwards;transition:background-color .35s}
.nf-m{padding:30px;background:rgba(var(--m-rgb),.16);border:1.5px dashed rgba(var(--m-rgb),.75);animation-delay:.1s}
.nf-b{padding:26px;background:rgba(var(--b-rgb),.18);border:2px solid rgba(var(--b-rgb),.85);animation-delay:.3s}
.nf-p{padding:26px;background:rgba(var(--p-rgb),.17);border:1.5px dashed rgba(var(--p-rgb),.75);animation-delay:.5s}
.nf-c{padding:14px 34px 6px;background:rgba(var(--c-rgb),.24);border:2px solid rgba(var(--c-rgb),.85);animation-delay:.7s}
.nf-l:hover{filter:brightness(1.15)}
.nf-code{font:800 clamp(86px,22vw,168px)/1.1 var(--fd);letter-spacing:-.04em;direction:ltr}
.nf-tag{display:inline-block;direction:ltr;margin-top:26px;font:500 12.5px/1 'JetBrains Mono',ui-monospace,monospace;background:var(--c);color:var(--on);padding:6px 10px;border-radius:5px}
.nf-in h1{font-size:clamp(26px,4.4vw,40px);margin:26px 0 8px}
.nf-in .lead{margin-inline:auto;font-size:16px;max-width:470px}
.nf-en{direction:ltr;unicode-bidi:isolate;margin-top:4px;font-size:14px;color:var(--mu)}
.nf-in .btns{justify-content:center}
@media(max-width:520px){.nf-m,.nf-b,.nf-p{padding:16px}.nf-c{padding:8px 18px 2px}.nf-in .btns .btn{flex:1 1 100%;justify-content:center}}

</style>
</head>
<body>
<header><div class="w">
  <a class="logo" href="/" aria-label="Kourosh">K<b>.</b></a>
</div></header>

<main class="nf w" id="main">
  <div class="nf-in">
    <div class="nf-l nf-m"><div class="nf-l nf-b"><div class="nf-l nf-p"><div class="nf-l nf-c"><p class="nf-code" aria-hidden="true">404</p></div></div></div></div>
    <span class="nf-tag" aria-hidden="true">main  0 &times; 0</span>
    <h1>این صفحه پیدا نشد.</h1>
    <p class="lead">ممکن است آدرس را اشتباه وارد کرده باشید یا صفحه جابه‌جا شده باشد. از لینک‌های زیر می‌توانید ادامه دهید.</p>
    <p class="nf-en" lang="en" dir="ltr">This page doesn't exist or has been moved.</p>
    <div class="btns"><a class="btn p" href="/">بازگشت به خانه</a><a class="btn" href="/projects.html">مشاهده پروژه‌ها</a><a class="btn" href="/about.html">درباره من</a></div>
  </div>
</main>
</body>
</html>
